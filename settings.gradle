pluginManagement {
    repositories {
        // 阿里云镜像放最前：plugins.gradle.org 会 303 重定向，gradle 跟随失败；
        // 阿里云直连（E:\gradle 的 nonProxyHosts 已排除它），稳定且快
        maven { name = 'AliyunPublic'; url = 'https://maven.aliyun.com/repository/public' }
        maven { name = 'AliyunGradlePlugin'; url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        gradlePluginPortal()
        maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
        maven { name = 'Sponge Snapshots'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

rootProject.name = 'MeowMachine'
